<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial GruaHelper</title>
<meta name="theme-color" content="#1a1f2e">
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1a1f2e}
header{background:#1a1f2e;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#7dd3d8;text-decoration:none}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:#fff;border:1px solid #dde3ec;border-radius:10px;padding:14px;margin:12px 0}
.badge{display:inline-block;background:#e8f0fe;color:#1a3a5a;border-radius:20px;padding:2px 10px;font-size:12px;margin-right:6px}
.summary{font-weight:700;margin:8px 0}
.meta{color:#5a6b84;font-size:12px}
.links a{margin-right:12px}
pre{white-space:pre-wrap;word-wrap:break-word;background:#f8f9fb;padding:8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<header>
<div><b>Historial GruaHelper</b> — interacciones del simulador</div>
<div><a href="./">← Volver al simulador</a></div>
</header>
<main>
<p class="links">
<a href="https://github.com/pickatroll12-arch/AN/blob/main/backend/data/historial_conversaciones.jsonl" target="_blank">Ver JSONL en GitHub</a>
<a href="https://github.com/pickatroll12-arch/AN/commits/main" target="_blank">Commits</a>
<a href="#" onclick="load();return false;">Recargar</a>
</p>
<div id="status">Cargando...</div>
<div id="list"></div>
</main>
<script>
const API = 'https://rigging-squishier-crystal.ngrok-free.dev/api/historial?limit=100';
async function load(){
  const s=document.getElementById('status'), list=document.getElementById('list');
  s.textContent='Cargando desde '+API+' ...';
  try{
    const r=await fetch(API, {headers:{'ngrok-skip-browser-warning':'1'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const arr=(data.historial||[]).slice().reverse();
    s.textContent='Total: '+data.total+' — últimas primero';
    list.innerHTML=arr.map(e=>`
      <div class="card">
        <div><span class="badge">${e._ts?e._ts.slice(0,19).replace('T',' '):''} UTC</span><span class="badge">${e.crane||''} ${e.module||''}</span><span class="badge">${e.model||''} ${e.provider||''}</span></div>
        <div class="summary">P: ${escapeHtml(e.question||'')}</div>
        <div><b>R:</b> ${escapeHtml(e.summary||'')}</div>
        <details><summary>Facts/Hypotheses/Questions/Sources</summary><pre>${escapeHtml(JSON.stringify({facts:e.facts,hypotheses:e.hypotheses,questions:e.questions,sources:e.sources},null,2))}</pre></details>
        <div class="meta">session ${escapeHtml(e.sessionId||'')} — mode ${escapeHtml(e.mode||'')}</div>
      </div>`).join('')||'<p>Sin registros aún.</p>';
  }catch(err){
    s.textContent='No se pudo cargar API (¿backend caído?). Usa el link a GitHub.';
    s.innerHTML+='<br><small>'+escapeHtml(err.message)+'</small>';
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
load();
</script>
</body>
</html>
